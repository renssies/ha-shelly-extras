# The change_light action. Fields mirror light.turn_on (names, selectors and
# capability filters) so it is a drop-in replacement. The `filter` blocks hide
# fields that don't apply to the selected light (e.g. a brightness-only light
# shows no color fields), exactly like light.turn_on.
change_light:
  # Exactly the same target picker as light.turn_on: a single light entity, a
  # device, an area, or a label. It is intentionally NOT restricted to
  # `integration: shelly` — that restriction prevents the frontend from
  # resolving a device/area target to its entities, which hides all the fields.
  # Non-Shelly targets are filtered out by the action handler instead.
  target:
    entity:
      domain: light
  fields:
    transition:
      filter:
        supported_features:
          - light.LightEntityFeature.TRANSITION
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    rgb_color:
      filter: &color_support
        attribute:
          supported_color_modes:
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      example: "[255, 100, 100]"
      selector:
        color_rgb:
    color_temp_kelvin:
      filter: &color_temp_support
        attribute:
          supported_color_modes:
            - light.ColorMode.COLOR_TEMP
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    brightness:
      filter: &brightness_support
        attribute:
          supported_color_modes:
            - light.ColorMode.BRIGHTNESS
            - light.ColorMode.COLOR_TEMP
            - light.ColorMode.HS
            - light.ColorMode.XY
            - light.ColorMode.RGB
            - light.ColorMode.RGBW
            - light.ColorMode.RGBWW
      selector:
        number:
          min: 0
          max: 255
    brightness_pct:
      filter: *brightness_support
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    color_temp:
      filter: *color_temp_support
      advanced: true
      selector:
        color_temp:
          unit: mired
          min: 153
          max: 500
    rgbw_color:
      filter: *color_support
      advanced: true
      example: "[255, 100, 100, 50]"
      selector:
        object:
    rgbww_color:
      filter: *color_support
      advanced: true
      example: "[255, 100, 100, 50, 70]"
      selector:
        object:
    hs_color:
      filter: *color_support
      advanced: true
      example: "[300, 70]"
      selector:
        object:
    xy_color:
      filter: *color_support
      advanced: true
      example: "[0.52, 0.43]"
      selector:
        object:
    color_name:
      filter: *color_support
      advanced: true
      selector:
        text:

# Send a raw RPC command to Gen2+ (RPC) Shelly devices. Works on any Shelly
# device, not just lights. Returns each device's RPC response.
rpc_call:
  # Targetable: Shelly devices, areas, labels, and light groups. The entity
  # picker is `domain: light` (not `integration: shelly`) so light groups — which
  # are light entities, not Shelly entities — can be selected; the handler
  # expands groups to their members and keeps only Gen2+ Shelly devices.
  target:
    device:
      integration: shelly
    entity:
      domain: light
  fields:
    method:
      required: true
      example: Switch.Set
      selector:
        text:
    params:
      example: '{"id": 0, "on": true}'
      selector:
        object:
