# Actions (services) exposed by Shelly Extras.
set_light_properties:
  # Same target picker as light.turn_on, restricted to Shelly lights: a single
  # light entity, a device, an area, or a label all work.
  target:
    entity:
      domain: light
      integration: shelly
  fields:
    brightness:
      required: false
      example: 128
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    brightness_pct:
      required: false
      example: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider
    color_temp_kelvin:
      required: false
      example: 3500
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    rgb_color:
      required: false
      example: "[255, 100, 100]"
      selector:
        color_rgb:
    rgbw_color:
      required: false
      example: "[255, 100, 100, 255]"
      selector:
        object:
    transition:
      required: false
      example: 2
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
          mode: box
